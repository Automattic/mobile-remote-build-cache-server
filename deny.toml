# cargo-deny configuration.
#   cargo deny check
# Run it in CI together with `cargo audit`.

[graph]
# Only the platforms the server ships for.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
# This crate itself is unpublished and carries no licence field.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Things the design deliberately does without. A dependency update that pulls
# one of these in should fail CI and be looked at.
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "ring" },
    { crate = "aws-lc-rs" },
    { crate = "serde" },
    { crate = "clap" },
    { crate = "axum" },
    { crate = "actix-web" },
    { crate = "prometheus" },
    { crate = "h2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
